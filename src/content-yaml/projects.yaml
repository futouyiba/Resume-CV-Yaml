    -
        title: 运动仿真游戏
        subtitle: Unity运动仿真与钓鱼体验项目
        tags:
            - Unity
            - 仿真体验
            - 鱼类行为
        description:
            - 负责经济系统、概率模型与鱼类行为相关设计，围绕模拟仿真钓鱼体验组织数值与行为反馈。
            - 将鱼类行为拆解为输入、状态、行为与反馈，推动玩法逻辑、状态流转和体验表现进入可运行系统验证。
            - 在Unity项目环境下协同验证数值、概率与行为模型，使设计调整能直接对应到玩家可感知的反馈变化。
    -
        title: <In-Network Fast Approximate Traffic Classifier>
        subtitle: 软硬件超高效率神经网络提升网络安全的科研项目
        tags:
            - LUT-AMM
            - 神经网络
            - 软硬件结合
        description:
            - 使用结合LUT的Approximate Matrix Multiplication提升模型推理速度，面向网络安全中的高响应场景。
            - 实现LUT-AMM的可微与可训练流程，将高速矩阵乘法带来的精度损失控制在可接受范围内。
            - 负责软件工程与算法部分，主要使用torch、C++、eigen、python；软件部分已完成并长期维护。
    -
        title: 《Zombie Simulator》
        subtitle: UEFN平台的非对称射击岛屿
        tags:
            - 第三人称射击
            - 泛元宇宙
        description:
            - 设计人类与感染者双阵营玩法，每局7个回合，通过感染、幸存与积分结算形成短局对抗节奏。
            - 负责设计、数值与编程，将阵营分配、感染状态、回合推进与得分反馈转化为可运行玩法原型。
            - 在UEFN限制下搭建配置与调试流程，支持玩法逻辑验证与快速迭代。
            - 因UEFN中国账号环境变化，测试阶段停止继续发布。
    -
        title: 《Meme Tycoon》
        subtitle: UEFN平台的放置经营岛屿
        tags:
            - 放置游戏
            - 模拟经营
            - 泛元宇宙
        description:
            - 以放置经营玩法为基础，结合北美互联网Meme题材设计吸量点与成长反馈。
            - 负责设计、数值与编程，将资源产出、经营升级、目标推进与奖励反馈构建为可运行玩法原型。
            - 在UEFN平台约束下完成配置与调试流程，验证放置经营循环是否成立。
