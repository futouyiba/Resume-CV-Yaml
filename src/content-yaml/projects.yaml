    -
        title: 《混沌与秩序》系列
        subtitle: '首款手机全3D MMO游戏'
        tags:
            - MMO游戏
            - 游戏数值
            - 线上运营
            - 从零开发
            - 游戏系统
        description:
            - 手机上首款全3D MMO游戏，Gameloft中国支柱项目，系列收入超3000万美元。
            - 作为数值策划参与第一款产品更新维护与第二款产品从零开发，主要研究战斗平衡与经济系统模型。
            - 在《混沌与秩序2》中从零搭建更有玩法深度的数值体系，加入随机属性、法术暴击、穿甲等机制，并基于历史数据重建成长曲线。
            - 力主将12个技能按钮缩减为4个，并通过武器技能、技能符文组合保留变化性；使用Lua脚本制作技能以支持快速迭代。
