    -
        title: 《修勾夜店手机App》
        subtitle: 3D蹦迪+语聊商业化app
        tags:
            - 语音聊天
            - 社交游戏
            - 泛元宇宙
        description:
            - 将3D蹦迪、社交游戏与语音聊天室结合，推动《修勾夜店》从内容热点进入完整App化与商业化验证。
            - 核心链路是将云蹦迪用户转化到语音聊天室，通过社交关系、主播模式与付费反馈验证商业模型。
            - 项目使用Unity实现多人场景互动，并在Mirror同步网络与HybridCLR热更框架下推进版本迭代和线上验证。
            - 项目完成两次上线与推广测试；受平台审核、用户结构与后续融资影响，项目终止并更名保留App壳。
    -
        title: 《云原生游戏项目》
        subtitle: 手机级传感器+服务器级算力带来全新体验
        tags:
            - 新技术
            - 角色扮演
        description:
            - 项目定义为体验必须依赖云游戏连接模式才能成立的游戏，利用手机传感器与服务器级渲染算力构建新体验。
            - 参与从概念到第一版设计案的推进，将角色体验拆解为传感输入、环境状态、AI行为与表现反馈。
            - 在UE中制作AIController与状态机（混合行为树）原型，结合蓝图+C++验证角色行为驱动与体验逻辑。
            - 探索puerts承载部分UE玩法逻辑的工作流，用于降低玩法迭代与工程实现之间的沟通成本。
            - 因公司资本方向变化停止继续做游戏，项目解散。
    -
        title: 《勒是地下城》
        subtitle: 真正适合手机、现代商业化的Platformer
        tags:
            - 商业化
            - Platformer
        description:
            - 面向手机平台设计Platformer体验，在简化操作、关卡节奏与商业化结构之间寻找平衡。
            - 负责商业策略、团队管理、项目管理、产品与美术方向，并自行编写部分代码、工具和策划文档支持验证。
            - 为压缩开发时间并持续迭代核心玩法，将机制设计转化为可测试内容，完成约1日游戏内容。
            - 玩法与画风测试反馈较好；后因发行配合与推广执行问题影响数据，项目缩减并于后续关闭。
    -
        title: “繁星”解决方案
        subtitle: 社区共建网络游戏平台
        tags:
            - 独立游戏
            - 商业平台
            - 解决方案
            - 社区经济
        description:
            - “繁星”是社区共建网络游戏解决方案，目标是降低独立开发者制作联机游戏的部署、运维与反作弊成本。
            - 方案依托自研“鞅”专利技术，主要支持帧同步游戏，第一代同步速率达到1秒2帧，第二代目标为1秒10帧。
            - 负责团队管理、项目管理、专利技术设计、产品设计、示例游戏开发与对外合作。
            - 通过《Destined Stone》与Unity多人TCG《Renaissance》验证平台部署、联网玩法与同步效率；后因资金问题中止。
    -
        title: 《Renaissance》
        subtitle: 组队对战的TCG（集换式卡牌）游戏
        tags:
            - 卡牌游戏
            - 联网游戏
            - 实时策略游戏
            - MOBA+TCG
            - 从零开发
        description:
            - 3对3组队对战TCG，强调队友支援、卡牌交换与团队归属感，用于验证“繁星”平台的实时联网能力。
            - 单人完成Unity开发部分，使用websocket、DoTween、Playmaker与C#实现战斗属性、buff、技能与动画队列。
            - 将卡牌效果拆解为状态、技能行为、结算顺序与表现反馈，构建可运行系统验证多人对战逻辑。
            - 借助“鞅”专利技术，《Renaissance》在“繁星”平台上单条侧链可同时运行7k+局游戏；项目作为示例游戏开源。
    -
        title: 《泉水指挥官》
        subtitle: 能”组队“的布阵策略游戏
        tags:
            - MOBA+”自走棋“
            - 分布式服务器
            - Unreal虚幻引擎
            - 从零开发
        description:
            - 组队对战的布阵策略游戏，核心是队友实时共同构建阵型，并在回合中观看英雄自动战斗。
            - 使用Unreal制作，并结合分布式服务器；使用C++与蓝图编写动画状态机、Gameplay Ability系统、Replication/RPC、Dedicated Server、GC FSM状态机等模块。
            - 将布阵、技能、单位状态、回合推进与战斗反馈拆解为可实现模块，通过工程原型验证玩法节奏和同步表现。
            - 负责团队管理、游戏设计与部分代码编写；项目因版号原因终止。
