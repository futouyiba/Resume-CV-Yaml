title: 个人评价
description: '数值/主策/制作人背景的游戏策划，长期参与战斗、数值、系统与玩法迭代。曾就职于Kabam与Gameloft，参与项目累计收入超5亿美元；也曾担任制作人，负责从设计、原型到上线的产品推进。具备UE/Unity/Lua/C++等工程实现经验，曾在UE项目中处理Gameplay Framework、Replication、蓝图+C++、AIController/行为树等玩法实现问题，也在Unity项目中参与Mirror同步网络、HybridCLR热更等技术栈下的玩法验证。能将设计拆解为输入、状态、行为、反馈，并构建可运行玩法原型验证逻辑与体验，减少设计与实现之间的信息损耗。曾参与AI科研项目，补强Python/C++/PyTorch等算法工程能力；同时为Unreal Engine中国社区QQ群管理员，长期参与UE技术交流。'
#description: '重理性、有商业思维、多面手的游戏产品人，对游戏AI有一定积累。擅长开发迭代、商业化，能写代码做工具。曾就职于Kabam & Gameloft，任职主策划/数值策划，项目收入超5亿美元；做过制作人，上线数款产品。喜欢机器学习，2015年起追Andrew Ng课程并完成作业拿到数个证书。'
