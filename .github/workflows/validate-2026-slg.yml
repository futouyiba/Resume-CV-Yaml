name: Validate 2026 SLG Resume

on:
  push:
    branches:
      - 2026-SLG
  workflow_dispatch:

# Validation workflow for the isolated resume branch.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build resume
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-build-2026-slg
          path: build
