name: Validate 2026 SLG Resume

on:
  push:
    branches:
      - 2026-SLG
  workflow_dispatch:

# Validation workflow for the isolated resume branch.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build resume
        run: npm run build

      - name: Render and verify browser output
        run: |
          mkdir -p render-root/ReactJSResumeWithPDF
          cp -R build/. render-root/ReactJSResumeWithPDF/
          python3 -m http.server 8080 --directory render-root >/tmp/resume-server.log 2>&1 &
          sleep 2
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          echo "Browser: $BROWSER"
          test -n "$BROWSER"
          URL=http://127.0.0.1:8080/ReactJSResumeWithPDF/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$URL" > rendered-dom.html
          grep -q '宋 甫' rendered-dom.html
          grep -q 'Apex Fishing' rendered-dom.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --no-pdf-header-footer --print-to-pdf=resume-2026-slg.pdf "$URL"
          test -s resume-2026-slg.pdf
          ls -lh resume-2026-slg.pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-build-2026-slg
          path: |
            build
            rendered-dom.html
            resume-2026-slg.pdf
